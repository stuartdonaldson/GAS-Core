name: Test

on:
  push:
    branches: [main, master]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  tag-guard:
    if: startsWith(github.ref, 'refs/tags/gas-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-tag-version.js "${GITHUB_REF_NAME}"
